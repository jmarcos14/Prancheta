# Compila o app Android (APK de depuração) a cada envio e guarda o arquivo
# como artefato do workflow, para baixar e instalar no celular.
name: App Android

on:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Montar o jogo e copiar para o projeto Android
        run: |
          node build.js
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: prancheta-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
