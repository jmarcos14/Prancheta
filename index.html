<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a2b1f">
<title>Prancheta Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Sofia+Sans:wght@400;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: coluna única de celular. Cabeçalho e abas são o quadro verde; o conteúdo vem em folhas de papel presas à prancheta. */
  --board: #0e3a2a; --board-2: #0a2b1f; --chalk: #eef4ea; --chalk-2: rgba(238, 244, 234, 0.64);
  --paper: #f1f4ec; --paper-2: #e2e8da; --ink: #14251c; --ink-2: #55685d; --rule: rgba(20, 37, 28, 0.13);
  --magnet: #ffd23f; --magnet-ink: #2b2100; --pen: #e5484d; --pen-blue: #2f6fed; --ok: #1e9a57;
  --board-3: #0d3626; --raise: #ffffff; --hl: #fff7d1; --hl-strong: #fff3bf; --mark: #ffd23f; --gold: #d99a00; --star-off: #c4ccbc;
  --pen-fill: #e5484d; --duel: #14251c; --seg-on: #f1f4ec; --edge: transparent; --wait-sh: #b9c1b0;
  --t-red: #ffe1df; --t-red-ink: #9c1c20; --t-ok: #d5f1e0; --t-ok-ink: #0f6b3a; --t-blue: #dce7ff; --t-blue-ink: #1c459c; --t-yel: #ffeaa6; --t-yel-ink: #5c4500;
  --r0: #ffb224; --r1: #4f8cff; --r2: #f6f3ea; --r3: #ff5b4f;
  --display: 'Sofia Sans Extra Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Sofia Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  color-scheme: light;
}
/* Tema escuro: o papel vira lousa. Vale pelo sistema, pelo visualizador (data-theme) ou pela escolha no jogo (data-tema). */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]):not([data-theme="light"]) {
    --board: #08201a; --board-2: #04130e; --board-3: #071c16; --chalk: #e9f0e6; --chalk-2: rgba(233, 240, 230, 0.6);
    --paper: #15261e; --paper-2: #263b30; --ink: #e9f0e6; --ink-2: #9cb0a3; --rule: rgba(233, 240, 230, 0.12);
    --pen: #ff6f66; --pen-blue: #86adff; --ok: #45d18a;
    --raise: #1d3228; --hl: #3b3512; --hl-strong: #4a4010; --mark: rgba(255, 210, 63, 0.3); --gold: #ffc53d; --star-off: #3d5145;
    --pen-fill: #c9403f; --duel: #4a6155; --seg-on: #2b4236; --edge: rgba(233, 240, 230, 0.09); --wait-sh: #0b1711;
    --t-red: #4b1f1e; --t-red-ink: #ffb4ae; --t-ok: #173e2b; --t-ok-ink: #8fe6b6; --t-blue: #1d3058; --t-blue-ink: #b5ccff; --t-yel: #4b3d0b; --t-yel-ink: #ffe08a;
    color-scheme: dark;
  }
}
:root[data-tema="escuro"], :root:not([data-tema])[data-theme="dark"] {
  --board: #08201a; --board-2: #04130e; --board-3: #071c16; --chalk: #e9f0e6; --chalk-2: rgba(233, 240, 230, 0.6);
  --paper: #15261e; --paper-2: #263b30; --ink: #e9f0e6; --ink-2: #9cb0a3; --rule: rgba(233, 240, 230, 0.12);
  --pen: #ff6f66; --pen-blue: #86adff; --ok: #45d18a;
  --raise: #1d3228; --hl: #3b3512; --hl-strong: #4a4010; --mark: rgba(255, 210, 63, 0.3); --gold: #ffc53d; --star-off: #3d5145;
  --pen-fill: #c9403f; --duel: #4a6155; --seg-on: #2b4236; --edge: rgba(233, 240, 230, 0.09); --wait-sh: #0b1711;
  --t-red: #4b1f1e; --t-red-ink: #ffb4ae; --t-ok: #173e2b; --t-ok-ink: #8fe6b6; --t-blue: #1d3058; --t-blue-ink: #b5ccff; --t-yel: #4b3d0b; --t-yel-ink: #ffe08a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--board-2); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pen-blue); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
#app {
  position: relative; max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--board) 0 64px, var(--board-3) 64px 128px);
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- cabeçalho ---------- */
#top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; color: var(--chalk); }
.top-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-l b { display: block; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-l small { color: var(--chalk-2); font-size: 12.5px; font-weight: 600; }
.cash { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.02em; color: var(--magnet); white-space: nowrap; }
.cash.neg { color: #ff8d86; }
.cash small { display: block; font-family: var(--body); font-size: 11px; font-weight: 600; color: var(--chalk-2); text-align: right; letter-spacing: 0; }

/* ---------- corpo e folhas ---------- */
#main { flex: 1; overflow-y: auto; padding: 6px 14px 22px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
#main::-webkit-scrollbar { display: none; }
#main > *, .ovscroll > * { flex-shrink: 0; }
.card { background: var(--paper); border-radius: 14px; padding: 14px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28), inset 0 0 0 1px var(--edge); }
.card.flat { padding: 0; overflow: hidden; }
h2 { font-family: var(--display); font-weight: 800; font-size: 23px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
h2 span { background: linear-gradient(transparent 58%, var(--mark) 58% 92%, transparent 92%); padding: 0 3px; margin: 0 -3px; }
h3 { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.head small, .muted { color: var(--ink-2); font-size: 13px; }
.hand { font-family: var(--hand); font-weight: 700; font-size: 21px; line-height: 1.1; color: var(--pen-blue); }
.hand.red { color: var(--pen); } .hand.ok { color: var(--ok); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowx { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 11px;
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; text-align: center; line-height: 1.1;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.cta { background: var(--magnet); color: var(--magnet-ink); font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; min-height: 56px; box-shadow: 0 4px 0 #b98f00; width: 100%; }
.btn.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 #b98f00; }
.btn.cta.wait { background: var(--paper-2); color: var(--ink-2); box-shadow: 0 4px 0 var(--wait-sh); font-size: 21px; }
.btn.red { background: var(--pen-fill); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }
.seg { display: flex; background: rgba(0, 0, 0, 0.28); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 38px; border-radius: 9px; color: var(--chalk-2); font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--seg-on); color: var(--ink); }
.seg.inpaper { background: var(--paper-2); }
.seg.inpaper button { color: var(--ink-2); }
.seg.inpaper button.on { background: var(--ink); color: var(--paper); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 99px; background: var(--paper-2); font-size: 13px; font-weight: 700; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--paper); }
.chip.warn { background: var(--t-red); color: var(--t-red-ink); } .chip.ok { background: var(--t-ok); color: var(--t-ok-ink); } .chip.info { background: var(--t-blue); color: var(--t-blue-ink); }
.chip.board { background: rgba(255, 255, 255, 0.1); color: var(--chalk); }

/* ---------- abas ---------- */
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--board-2); border-top: 2px solid rgba(238, 244, 234, 0.16); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 3px; color: var(--chalk-2); font-size: 11.5px; font-weight: 700; border-radius: 10px; position: relative; }
#tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#tabs button.on { color: var(--magnet); }
#tabs .badge { position: absolute; top: 0; left: 55%; min-width: 17px; height: 17px; border-radius: 9px; background: var(--pen-fill); color: #fff; font-size: 11px; line-height: 17px; padding: 0 4px; }

/* ---------- ímãs e jogadores ---------- */
.mag {
  --c: var(--r2); display: inline-grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 42%), var(--c);
  color: #101a14; font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 0.01em;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.16);
}
.mag.p0 { --c: var(--r0); } .mag.p1 { --c: var(--r1); } .mag.p2 { --c: var(--r2); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.16), inset 0 0 0 1px rgba(0, 0, 0, 0.12); } .mag.p3 { --c: var(--r3); }
.mag.rg { font-size: 13.5px; letter-spacing: 0; }
.mag.big { width: 62px; height: 62px; font-size: 32px; }
.mag.big.rg { font-size: 20px; }
.mag.rank { --c: var(--paper-2); color: var(--ink); font-size: 17px; }
.prow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; text-align: left; border-top: 1px solid var(--rule); }
.prow:first-child { border-top: 0; }
.prow b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow small { display: block; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow.off { opacity: 0.55; }
.prow .val { font-family: var(--display); font-weight: 800; font-size: 19px; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; background: var(--paper-2); color: var(--ink); vertical-align: 1px; }
.tag.red { background: var(--t-red); color: var(--t-red-ink); } .tag.blue { background: var(--t-blue); color: var(--t-blue-ink); } .tag.yel { background: var(--t-yel); color: var(--t-yel-ink); } .tag.ok { background: var(--t-ok); color: var(--t-ok-ink); }
.bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }
.bar.mid i { background: var(--gold); } .bar.low i { background: var(--pen); }
.mini { width: 46px; flex: none; }
.mini span { display: block; font-size: 10.5px; font-weight: 800; color: var(--ink-2); text-align: right; margin-bottom: 2px; }
.stars { display: inline-block; font-size: 13px; letter-spacing: 1px; background: linear-gradient(90deg, var(--gold) calc(var(--v) * 20%), var(--star-off) 0); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- campo ---------- */
.pitch { position: relative; border-radius: 14px; overflow: hidden; background: repeating-linear-gradient(180deg, #1c7a4c 0 12.5%, #1a7147 12.5% 25%); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.28), inset 0 0 0 3px rgba(255, 255, 255, 0.5); }
.pitch.v { aspect-ratio: 10 / 11.4; }
.pitch.h { aspect-ratio: 16 / 9.4; background: repeating-linear-gradient(90deg, #1c7a4c 0 10%, #1a7147 10% 20%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: rgba(255, 255, 255, 0.5); stroke-width: 0.5; }
.slot { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 70px; }
.slot .mag { width: 44px; height: 44px; font-size: 23px; }
.slot.sel .mag { outline: 3px solid var(--magnet); outline-offset: 2px; }
.slot .nm { max-width: 100%; padding: 1px 6px; border-radius: 6px; background: rgba(6, 28, 19, 0.72); color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .en { width: 34px; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.4); overflow: hidden; }
.slot .en i { display: block; height: 100%; background: #7df0a8; }
.slot .en.mid i { background: var(--magnet); } .slot .en.low i { background: #ff7b72; }
.slot .wr { position: absolute; top: -4px; right: 8px; width: 17px; height: 17px; border-radius: 50%; background: var(--pen-fill); color: #fff; font-size: 12px; font-weight: 800; line-height: 17px; text-align: center; }

/* ---------- duelo de setores ---------- */
.duel { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; gap: 8px; }
.duel + .duel { margin-top: 7px; }
.duel b { font-family: var(--display); font-weight: 800; font-size: 20px; text-align: center; }
.duel .track { position: relative; height: 22px; border-radius: 6px; background: var(--pen-fill); overflow: hidden; }
.duel .track i { position: absolute; inset: 0 auto 0 0; background: var(--duel); border-right: 2px solid var(--paper); }
.duel .track span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.vs .t { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.vs .t b { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1; text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs .t small { color: var(--ink-2); font-size: 12px; }
.vs .x { font-family: var(--hand); font-weight: 700; font-size: 26px; color: var(--ink-2); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: #9aa69c; }
.dots i.V { background: var(--ok); } .dots i.D { background: var(--pen); }

/* ---------- post-it e notas ---------- */
.postit { background: var(--magnet); color: var(--magnet-ink); border-radius: 3px 3px 14px 3px; padding: 12px 14px 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); transform: rotate(-0.6deg); }
.postit:nth-of-type(even) { transform: rotate(0.5deg); }
.postit .hand { color: var(--magnet-ink); font-size: 25px; margin-bottom: 4px; }
.postit p { font-size: 14.5px; margin-bottom: 10px; }
.postit .btn { background: var(--magnet-ink); color: var(--magnet); }
.note { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--rule); }
.note:first-child { border-top: 0; }
.note .ic { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--paper-2); display: grid; place-items: center; font-size: 15px; }
.note b { font-size: 14.5px; } .note p { font-size: 13.5px; color: var(--ink-2); }
.note .pk { font-size: 12.5px; color: var(--ink); font-weight: 700; margin-top: 2px; }
.meter { height: 10px; border-radius: 5px; background: var(--paper-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
.meter.low i { background: var(--pen); } .meter.good i { background: var(--ok); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14.5px; }
.kv:first-child { border-top: 0; }
.kv b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv .pos { color: var(--ok); } .kv .neg { color: var(--pen); }
.opt { display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px var(--rule); }
.opt.on { box-shadow: inset 0 0 0 2.5px var(--ink); background: var(--raise); }
.opt b { display: block; font-size: 15px; } .opt small { display: block; color: var(--ink-2); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fbtn { padding: 9px 4px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px var(--rule); text-align: center; }
.fbtn.on { background: var(--ink); color: var(--paper); box-shadow: none; }
.fbtn b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; }
.fbtn small { font-size: 10.5px; font-weight: 700; opacity: 0.75; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 16px; height: 8px; border-radius: 2px; background: var(--paper-2); }
.pips i.on { background: var(--ink); }
.big { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 0.95; letter-spacing: 0.01em; }
.big.neg { color: var(--pen); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 24px; font-weight: 700; line-height: 1; }
.stepper b { flex: 1; text-align: center; font-family: var(--display); font-weight: 800; font-size: 30px; }
input[type=range] { width: 100%; accent-color: var(--ink); height: 32px; }
input[type=text] { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 11px; border: 1.5px solid var(--ink); background: var(--raise); font: inherit; font-weight: 700; color: var(--ink); }
label { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: block; margin-bottom: 5px; }

/* ---------- tabela ---------- */
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-2); padding: 8px 4px; text-align: center; }
td { padding: 8px 4px; text-align: center; border-top: 1px solid var(--rule); }
td.l, th.l { text-align: left; } td.pts { font-weight: 800; }
tr.me td { background: var(--hl); font-weight: 700; }
td.z { width: 26px; padding-left: 12px; font-weight: 800; position: relative; }
tr.up td.z::before, tr.dn td.z::before, tr.ch td.z::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 5px; border-radius: 0 3px 3px 0; background: var(--ok); }
tr.dn td.z::before { background: var(--pen); } tr.ch td.z::before { background: var(--gold); }
.tclub { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tclub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--rule); font-size: 14px; }
.fx:first-child { border-top: 0; }
.fx span:first-child { text-align: right; } .fx b { font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.fx .w { font-weight: 800; } .fx.me { background: var(--hl); }

/* ---------- folha deslizante ---------- */
#sheet { position: fixed; inset: 0; z-index: 30; display: none; }
#sheet.on { display: block; }
#sheet .bg { position: absolute; inset: 0; background: rgba(4, 16, 11, 0.62); }
#sheetBox { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: inset 0 1px 0 var(--edge); padding: 16px 14px calc(18px + env(safe-area-inset-bottom, 0px)); animation: up 0.2s ease-out; }

  const m = me(), main = $('#main'), view = U.tab + ':' + (U.sub[U.tab] || ''), keep = view === U.view ? main.scrollTop : 0;
  $('#top').innerHTML = `<div class="top-l">${crest(m, 38)}<div style="min-width:0"><b>${esc(m.name)}</b><small>${DIV_N[m.div]} · ${posOf(m)}º lugar · ${G.year}</small></div></div><div class="cash num ${G.money < 0 ? 'neg' : ''}">${money(G.money)}<small>em caixa</small></div>`;
  main.innerHTML = VIEW[U.tab]();
  main.scrollTop = keep; U.view = view;
  const pend = pending().length;
  $('#tabs').innerHTML = TABS.map(([k, l, ic]) => `<button class="${U.tab === k ? 'on' : ''}" data-a="go" data-t="${k}" aria-label="${l}"><svg viewBox="0 0 24 24">${ic}</svg>${l}${k === 'home' && pend ? `<span class="badge">${pend}</span>` : ''}${k === 'merc' && G.youth.length && lgRound() < 2 ? '<span class="badge">!</span>' : ''}</button>`).join('');
}
const VIEW = {};

// ---------- Início ----------
function duel(lbl, a, b) { return `<div class="duel"><b class="num">${Math.round(a)}</b><div class="track"><i style="width:${clamp(50 + (a - b) * 2.4, 8, 92)}%"></i><span>${lbl}</span></div><b class="num">${Math.round(b)}</b></div>`; }
const formDots = c => `<span class="dots">${c.hist.map(h => `<i class="${h}"></i>`).join('') || '<i></i>'}</span>`;
function matchup(mine, theirs) {
  if (STYLES[mine].beats === theirs) return `<p class="hand ok">Seu estilo leva vantagem sobre ${STYLES[theirs].n.toLowerCase()}: +6% em tudo.</p>`;
  if (STYLES[theirs].beats === mine) return `<p class="hand red">Cuidado: ${STYLES[theirs].n.toLowerCase()} leva vantagem sobre o seu estilo.</p>`;
  return '';
}
VIEW.home = () => {
  const m = me(), f = myFixture(), pend = pending();
  let h = '';
  if (!G.tip) h += `<div class="card stack"><div class="head"><h2><span>Primeiro dia</span></h2></div><p class="hand">1. Em Time, toque num ímã para trocar o jogador e escolha formação e estilo.</p><p class="hand">2. Em Mercado, promova os garotos da base e reforce o elenco enquanto a janela está aberta.</p><p class="hand">3. Volte aqui e toque em Jogar. Cada jogo vale uma semana.</p><button class="btn ghost" data-a="tipOk">Entendi</button></div>`;
  if (f) {
    const pv = preview(G.clubs[f.h], G.clubs[f.a]), my = f.home ? pv.h : pv.a, op = f.home ? pv.a : pv.h, o = f.opp;
    h += `<div class="card stack"><div class="head"><h2><span>Próximo jogo</span></h2><small>${entryLabel(f.e)}</small></div>
      <div class="vs"><div class="t">${crest(m, 52)}<b>${esc(m.name)}</b><small>${f.home ? 'em casa' : 'visitante'} · ${m.form}</small></div><div class="x">vs</div><button class="t" data-a="club" data-id="${o.id}">${crest(o, 52)}<b>${esc(o.name)}</b><small>${f.e.t === 'L' ? posOf(o) + 'º · ' : DIV_N[o.div] + ' · '}${o.form} · ${STYLES[o.style].n}</small></button></div>
      <div>${duel('seu ataque × defesa deles', my.atk, 0.7 * op.def + 0.3 * op.gk)}${duel('meio-campo', my.mid, op.mid)}${duel('sua defesa × ataque deles', 0.7 * my.def + 0.3 * my.gk, op.atk)}</div>
      ${matchup(m.style, o.style)}
      ${pend.length ? `<button class="btn cta wait" data-a="toPend">Responda ${plural(pend.length, 'pendência', 'pendências')}</button>` : '<button class="btn cta" data-a="play">Jogar</button>'}
      <div class="rowx" style="justify-content:space-between"><span class="muted">Últimos jogos deles ${formDots(o)}</span><button class="btn ghost sm" data-a="go" data-t="time">Ajustar time</button></div></div>`;
  }
  h += pend.map(it => `<div class="postit" id="pend${it.id}"><div class="hand">${esc(it.t)}</div><p>${esc(it.x)}</p><div class="btns">${it.o.map((l, i) => `<button class="btn sm" data-a="res" data-id="${it.id}" data-i="${i}">${esc(l)}</button>`).join('')}</div></div>`).join('');
  // avisos
  const inj = m.players.filter(p => p.inj).length, sus = m.players.filter(p => p.sus).length, tired = m.lineup.map(pl).filter(p => p && p.en < 60).length, exp = m.players.filter(p => p.ctr <= 1).length;
  const al = [];
  al.push(windowOpen() ? '<button class="chip ok" data-a="go" data-t="merc">Janela aberta</button>' : '<button class="chip board" data-a="go" data-t="merc">Janela fechada</button>');
  if (G.money < 0) al.push('<button class="chip warn" data-a="go" data-t="clube">Caixa no vermelho</button>');
  if (inj) al.push(`<button class="chip warn" data-a="go" data-t="time">${plural(inj, 'lesionado', 'lesionados')}</button>`);
  if (sus) al.push(`<button class="chip warn" data-a="go" data-t="time">${plural(sus, 'suspenso', 'suspensos')}</button>`);
  if (tired) al.push(`<button class="chip info" data-a="go" data-t="time">${plural(tired, 'titular cansado', 'titulares cansados')}</button>`);
  if (exp && lgRound() >= 9) al.push(`<button class="chip info" data-a="go" data-t="merc" data-s="sell">${plural(exp, 'contrato acabando', 'contratos acabando')}</button>`);
  if (G.youth.length) al.push(`<button class="chip info" data-a="go" data-t="merc" data-s="base">${plural(G.youth.length, 'garoto na base', 'garotos na base')}</button>`);
  h += `<div class="chips">${al.join('')}</div>`;
  const c = G.board.conf, pos = posOf(m);
  h += `<div class="card stack"><div class="head"><h2><span>Diretoria</span></h2><small>meta: até ${G.board.obj.pos}º</small></div><div class="rowx"><div class="grow"><b>${G.board.obj.t}</b><div class="muted">Você está em ${pos}º na ${DIV_N[m.div]}.</div></div><div class="big num" style="font-size:34px">${Math.round(c)}%</div></div><div class="meter ${c < 30 ? 'low' : c >= 70 ? 'good' : ''}"><i style="width:${c}%"></i></div><div class="muted">Confiança no seu trabalho. Se zerar, você é demitido.</div></div>`;
  const notes = G.inbox.filter(i => !i.o || i.done).slice(0, 12);
  h += `<div class="card flat"><div class="head" style="padding:14px 14px 0;margin:0"><h2><span>Caixa de entrada</span></h2><small>semana ${G.week}</small></div>${notes.map(n => `<div class="note"><span class="ic">${n.ic}</span><div><b>${esc(n.t)}</b><p>${esc(n.o ? n.done : n.x)}</p>${n.o ? `<div class="pk">Você escolheu: ${esc(n.pick || '—')}</div>` : ''}</div></div>`).join('') || '<p class="muted" style="padding:14px">Nada por aqui ainda.</p>'}</div>`;
  return h;
};

// ---------- Time ----------
function pitchV(c) {
  const roles = slotRoles(c.form), n = [1, ...FORMS[c.form].n], ys = [89, 67, 42, 16];
  let k = 0, h = '';
  for (let r = 0; r < 4; r++) for (let i = 0; i < n[r]; i++, k++) {
    const p = pl(c.lineup[k]); if (!p) continue;
    const x = 50 + ((i + 1) / (n[r] + 1) * 100 - 50) * (n[r] >= 4 ? 1.16 : 1.05);
    const y = ys[r] + (n[r] >= 5 ? (i % 2 ? 3.4 : -3.4) : n[r] === 4 ? (i === 0 || i === 3 ? -2.6 : 2.6) : 0);
    const odd = r !== p.pos && p.tr !== 'coringa';
    h += `<button class="slot" style="left:${x}%;top:${y}%" data-a="slot" data-k="${k}" aria-label="${esc(p.n)}, ${POS_N[r]}">${mag(r, Math.round(ovrIn(p, r)))}${odd ? '<span class="wr" title="Fora de posição">!</span>' : ''}<span class="nm">${esc(last(p.n))}</span><span class="en ${enCls(p.en)}"><i style="width:${p.en}%"></i></span></button>`;
  }
  return `<div class="pitch v">${LINES_V}${h}</div>`;
}
VIEW.time = () => {
  const m = me(), s = U.sub.time, f = myFixture();
  fixLineup(m);
  let h = seg('time', [['esc', 'Escalação'], ['tat', 'Tática'], ['tre', 'Treino']]);
  if (s === 'esc') {
    const pv = f ? preview(G.clubs[f.h], G.clubs[f.a]) : null, my = pv ? (f.home ? pv.h : pv.a) : null;
    const rest = m.players.filter(p => !m.lineup.includes(p.id)), ok = rest.filter(avail).sort((a, b) => ovr(b) - ovr(a)), out = rest.filter(p => !avail(p));
    h += pitchV(m);
    h += `<div class="rowx"><span class="chip board">${m.form}</span><span class="chip board">${STYLES[m.style].n}</span><span class="grow"></span><button class="btn sm" style="background:var(--magnet);color:var(--magnet-ink)" data-a="auto">Melhor time</button></div>`;
    if (my) h += `<div class="card"><div class="head"><h3>Força prevista no próximo jogo</h3></div><div class="stat3" style="grid-template-columns:repeat(4,1fr)"><div><b class="num">${Math.round(0.7 * my.def + 0.3 * my.gk)}</b><small>Defesa</small></div><div><b class="num">${Math.round(my.mid)}</b><small>Meio</small></div><div><b class="num">${Math.round(my.atk)}</b><small>Ataque</small></div><div><b class="num">${Math.round(m.fam)}%</b><small>Entrosam.</small></div></div><p class="muted" style="margin-top:8px">Toque num ímã para trocar. O “!” vermelho marca jogador fora da posição. Barra curta é jogador cansado.</p></div>`;
    h += `<div class="card flat"><div class="head" style="padding:14px 14px 0;margin:0"><h2><span>Reservas</span></h2><small>${m.players.length} no elenco</small></div>${ok.map(p => prow(p)).join('') || '<p class="muted" style="padding:14px">Sem reservas disponíveis.</p>'}</div>`;
    if (out.length) h += `<div class="card flat"><div class="head" style="padding:14px 14px 0;margin:0"><h2><span>Fora de combate</span></h2></div>${out.map(p => prow(p, { off: 1 })).join('')}</div>`;
  } else if (s === 'tat') {
    const o = f && f.opp;
    const mod = F => [['DEF', F.def], ['MEI', F.mid], ['ATA', F.atk]].filter(x => x[1] !== 1).map(x => `${x[0]} ${x[1] > 1 ? '+' : '−'}${Math.round(Math.abs(x[1] - 1) * 100)}`).join(' · ') || 'neutra';
    h += `<div class="card stack"><div class="head"><h2><span>Entrosamento</span></h2><b class="num">${Math.round(m.fam)}%</b></div><div class="meter ${m.fam < 45 ? 'low' : m.fam >= 80 ? 'good' : ''}"><i style="width:${m.fam}%"></i></div><p class="muted">Vale de −6% a +2% em todos os setores. Sobe a cada jogo e com treino tático. Trocar a formação derruba 40%; trocar o estilo, 22%.</p>${o ? `<p class="hand">O ${esc(o.name)} joga no ${o.form}, ${STYLES[o.style].n.toLowerCase()}.</p>` : ''}</div>`;
    h += `<div class="card stack"><div class="head"><h2><span>Formação</span></h2></div><div class="grid4">${Object.keys(FORMS).map(k => `<button class="fbtn ${m.form === k ? 'on' : ''}" data-a="form" data-v="${k}"><b>${k}</b><small>${mod(FORMS[k])}</small></button>`).join('')}</div></div>`;
    h += `<div class="card stack"><div class="head"><h2><span>Estilo de jogo</span></h2></div>${Object.keys(STYLES).map(k => { const S = STYLES[k], lose = Object.keys(STYLES).find(x => STYLES[x].beats === k); return `<button class="opt ${m.style === k ? 'on' : ''}" data-a="style" data-v="${k}"><b>${S.n}${o && S.beats === o.style ? ' <span class="tag ok">bom contra o próximo rival</span>' : ''}${o && STYLES[o.style].beats === k ? ' <span class="tag red">ruim contra o próximo rival</span>' : ''}</b><small>${S.d}</small>${S.beats ? `<small>Leva vantagem sobre ${STYLES[S.beats].n.toLowerCase()}, perde para ${STYLES[lose].n.toLowerCase()}.</small>` : ''}</button>`; }).join('')}</div>`;
    h += `<div class="card stack"><div class="head"><h2><span>Postura inicial</span></h2><small>dá para mudar durante o jogo</small></div><div class="seg inpaper">${Object.keys(MENT).map(k => `<button class="${m.ment === k ? 'on' : ''}" data-a="ment" data-v="${k}">${MENT[k].n}</button>`).join('')}</div><p class="muted">${MENT[m.ment].d}.</p></div>`;
  } else {
    const T = TRAIN[G.train.f], I = INTENS[G.train.i], rec = 34 + G.fac.med * 3 + T.rec + I.rec;
    h += `<div class="card stack"><div class="head"><h2><span>Foco da semana</span></h2></div>${Object.keys(TRAIN).map(k => `<button class="opt ${G.train.f === k ? 'on' : ''}" data-a="train" data-v="${k}"><b>${TRAIN[k].n}</b><small>${TRAIN[k].d}</small></button>`).join('')}</div>`;
    h += `<div class="card stack"><div class="head"><h2><span>Intensidade</span></h2></div><div class="seg inpaper">${INTENS.map((x, i) => `<button class="${G.train.i === i ? 'on' : ''}" data-a="intens" data-v="${i}">${x.n}</button>`).join('')}</div><p class="muted">${I.d}</p><div>${kv('Energia recuperada por semana', '+' + rec)}${kv('Um jogo inteiro gasta', 'cerca de 33')}${kv('Ritmo de evolução', '×' + (T.g * I.g * (1 + 0.2 * G.fac.ct)).toFixed(2).replace('.', ','))}${kv('Risco de lesão no treino', ['baixo', 'normal', 'alto'][G.train.i])}${kv('Entrosamento por semana', '+' + (T.fam + 4))}</div><p class="muted">Jovens evoluem rápido até o potencial; depois dos 30 o nível cai. Quem joga evolui mais.</p></div>`;
  }
  return h;
};

// ---------- Mercado ----------
VIEW.merc = () => {
  const m = me(), s = U.sub.merc, open = windowOpen();
  let h = seg('merc', [['buy', 'Contratar'], ['sell', 'Meu elenco'], ['base', 'Base']]);
  if (s === 'buy') {
    h += `<div class="chips">${open ? '<span class="chip ok">Janela aberta</span>' : '<span class="chip warn">Janela fechada: só jogadores sem clube</span>'}<span class="chip board">Olheiros em campo: ${G.scoutQ.length}/${1 + G.fac.olh}</span><span class="chip board">Elenco ${m.players.length}/${SQUAD_MAX}</span></div>`;
    h += `<div class="chips">${[[-1, 'Todos'], [0, 'GOL'], [1, 'DEF'], [2, 'MEI'], [3, 'ATA']].map(([v, l]) => `<button class="chip ${U.filt === v ? 'on' : ''}" data-a="filt" data-v="${v}">${l}</button>`).join('')}</div>`;
    const list = [...G.free.map(p => [p, null]), ...G.market.map(id => [pl(id), clubOf(id)]).filter(x => x[0] && x[1] && x[1].id)].filter(x => U.filt < 0 || x[0].pos === U.filt).sort((a, b) => estOvr(b[0]) - estOvr(a[0]));
    h += `<div class="card flat">${list.map(([p, c]) => { prepAsk(p); return prow(p, { off: c && !open, sub: `${POS[p.pos]} · ${p.age} anos · ${c ? esc(c.name) : 'sem clube'}`, r: `<span class="right"><span class="val num">${money(p.ask)}</span><small class="muted" style="display:block">${c ? 'pedida' : 'luvas'}</small></span>` }); }).join('') || '<p class="muted" style="padding:14px">Ninguém nessa posição agora.</p>'}</div>`;
    h += '<p class="muted" style="color:var(--chalk-2)">Faixas como 58–66 são estimativas. Mande um olheiro para ver o nível exato e o potencial. Você também pode abrir qualquer clube em Tabelas e fazer proposta por quem não está à venda (sai mais caro).</p>';
  } else if (s === 'sell') {
    const list = m.players.slice().sort((a, b) => valueOf(b) - valueOf(a));
    h += `<div class="card"><div>${kv('Folha salarial', money(wageBill()) + ' por semana')}${kv('Contratos que acabam este ano', m.players.filter(p => p.ctr <= 1).length)}</div><p class="muted" style="margin-top:6px">Abra a ficha para renovar, pôr à venda ou dispensar. Propostas chegam na caixa de entrada enquanto a janela está aberta.</p></div>`;
    h += `<div class="card flat">${list.map(p => prow(p, { sub: `${POS[p.pos]} · ${p.age} anos · ${money(p.w)}/sem · até ${ctrEnd(p)}${p.ctr <= 1 ? ' <span class="tag yel">acaba</span>' : ''}`, r: `<span class="val num">${money(valueOf(p))}</span>` })).join('')}</div>`;
  } else {
    h += `<div class="card"><p class="muted">Todo começo de temporada a peneira revela 3 garotos. Promova quem interessa: quem ficar aqui vai embora no fim do ano. Categorias de base melhores revelam garotos melhores.</p></div>`;
    h += G.youth.map(p => `<div class="card stack"><div class="rowx">${pmag(p)}<div class="grow"><b>${esc(p.n)}</b><div class="muted">${POS_N[p.pos]} · ${p.age} anos${p.tr ? ' · ' + TRAITS[p.tr].n : ''}</div></div><div class="right">${stars(p.pot)}<div class="muted">potencial ${p.pot}</div></div></div><div class="btns"><button class="btn sm" data-a="promote" data-id="${p.id}">Promover (R$ 1 mil/sem)</button><button class="btn ghost sm" data-a="player" data-id="${p.id}">Ficha</button><button class="btn ghost sm" data-a="dismiss" data-id="${p.id}">Dispensar</button></div></div>`).join('') || '<div class="card"><p class="hand">Ninguém na base agora. A próxima peneira é no começo da temporada.</p></div>';
  }
  return h;

    h += `<div class="card stack"><div class="head"><h2><span>Diretoria</span></h2><small>meta: até ${G.board.obj.pos}º</small></div><b>${G.board.obj.t}</b><div class="meter ${c < 30 ? 'low' : c >= 70 ? 'good' : ''}"><i style="width:${c}%"></i></div><div>${kv('Confiança', Math.round(c) + '%')}${kv('Reputação do clube', Math.round(m.rep) + ' de 100')}${kv('Temporada', G.season + 'ª')}</div><p class="muted">Reputação atrai patrocínio, público e jogadores melhores.</p></div>`;
