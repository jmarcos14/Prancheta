<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2b1f">
<title>Prancheta Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Sofia+Sans:wght@400;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: coluna única de celular. Cabeçalho e abas são o quadro verde; o conteúdo vem em folhas de papel presas à prancheta. */
  --board: #0e3a2a; --board-2: #0a2b1f; --chalk: #eef4ea; --chalk-2: rgba(238, 244, 234, 0.64);
  --paper: #f1f4ec; --paper-2: #e2e8da; --ink: #14251c; --ink-2: #55685d; --rule: rgba(20, 37, 28, 0.13);
  --magnet: #ffd23f; --magnet-ink: #2b2100; --pen: #e5484d; --pen-blue: #2f6fed; --ok: #1e9a57;
  --board-3: #0d3626; --raise: #ffffff; --hl: #fff7d1; --hl-strong: #fff3bf; --mark: #ffd23f; --gold: #d99a00; --star-off: #c4ccbc;
  --frame: #d5dacf; --card-sh: 0 1px 0 rgba(0, 0, 0, 0.18), 0 14px 26px -18px rgba(0, 0, 0, 0.75);
  --pen-fill: #e5484d; --duel: #14251c; --seg-on: #f1f4ec; --edge: transparent; --wait-sh: #b9c1b0;
  --t-red: #ffe1df; --t-red-ink: #9c1c20; --t-ok: #d5f1e0; --t-ok-ink: #0f6b3a; --t-blue: #dce7ff; --t-blue-ink: #1c459c; --t-yel: #ffeaa6; --t-yel-ink: #5c4500;
  /* áreas seguras: o app Android injeta --safe-area-inset-*; no navegador vale env() */
  --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --r0: #ffb224; --r1: #4f8cff; --r2: #f6f3ea; --r3: #ff5b4f;
  --display: 'Sofia Sans Extra Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Sofia Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  color-scheme: light;
}
/* Tema escuro: o papel vira lousa. Vale pelo sistema, pelo visualizador (data-theme) ou pela escolha no jogo (data-tema). */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]):not([data-theme="light"]) {
    --board: #08201a; --board-2: #04130e; --board-3: #071c16; --chalk: #e9f0e6; --chalk-2: rgba(233, 240, 230, 0.6);
    --paper: #15261e; --paper-2: #263b30; --ink: #e9f0e6; --ink-2: #9cb0a3; --rule: rgba(233, 240, 230, 0.12);
    --pen: #ff6f66; --pen-blue: #86adff; --ok: #45d18a;
    --raise: #1d3228; --hl: #3b3512; --hl-strong: #4a4010; --mark: rgba(255, 210, 63, 0.3); --gold: #ffc53d; --star-off: #3d5145;
    --frame: #33473c; --pen-fill: #c9403f; --duel: #4a6155; --seg-on: #2b4236; --edge: rgba(233, 240, 230, 0.09); --wait-sh: #0b1711;
    --t-red: #4b1f1e; --t-red-ink: #ffb4ae; --t-ok: #173e2b; --t-ok-ink: #8fe6b6; --t-blue: #1d3058; --t-blue-ink: #b5ccff; --t-yel: #4b3d0b; --t-yel-ink: #ffe08a;
    color-scheme: dark;
  }
}
:root[data-tema="escuro"], :root:not([data-tema])[data-theme="dark"] {
  --board: #08201a; --board-2: #04130e; --board-3: #071c16; --chalk: #e9f0e6; --chalk-2: rgba(233, 240, 230, 0.6);
  --paper: #15261e; --paper-2: #263b30; --ink: #e9f0e6; --ink-2: #9cb0a3; --rule: rgba(233, 240, 230, 0.12);
  --pen: #ff6f66; --pen-blue: #86adff; --ok: #45d18a;
  --raise: #1d3228; --hl: #3b3512; --hl-strong: #4a4010; --mark: rgba(255, 210, 63, 0.3); --gold: #ffc53d; --star-off: #3d5145;
  --frame: #33473c; --pen-fill: #c9403f; --duel: #4a6155; --seg-on: #2b4236; --edge: rgba(233, 240, 230, 0.09); --wait-sh: #0b1711;
  --t-red: #4b1f1e; --t-red-ink: #ffb4ae; --t-ok: #173e2b; --t-ok-ink: #8fe6b6; --t-blue: #1d3058; --t-blue-ink: #b5ccff; --t-yel: #4b3d0b; --t-yel-ink: #ffe08a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--board-2); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pen-blue); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
#app {
  position: relative; max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--board) 0 64px, var(--board-3) 64px 128px);
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- cabeçalho ---------- */
#top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + var(--sat)) 14px 8px; color: var(--chalk); }
.top-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-l b { display: block; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-l small { color: var(--chalk-2); font-size: 12.5px; font-weight: 600; }
.cash { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.02em; color: var(--magnet); white-space: nowrap; }
.cash.neg { color: #ff8d86; }
.cash small { display: block; font-family: var(--body); font-size: 11px; font-weight: 600; color: var(--chalk-2); text-align: right; letter-spacing: 0; }

/* ---------- corpo e folhas ---------- */
#main { flex: 1; overflow-y: auto; padding: 8px 14px 26px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
#main.enter > * { animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
#main.enter > :nth-child(2) { animation-delay: 0.04s; } #main.enter > :nth-child(3) { animation-delay: 0.08s; } #main.enter > :nth-child(n+4) { animation-delay: 0.12s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
#main::-webkit-scrollbar { display: none; }
#main > *, .ovscroll > * { flex-shrink: 0; }
.card { display: block; width: 100%; background: var(--paper); color: var(--ink); border-radius: 18px; padding: 16px; box-shadow: var(--card-sh), inset 0 0 0 1px var(--edge); }
.card.rowx { display: flex; }
.pad { padding: 16px 16px 0; margin: 0; }
p.pad { padding: 14px 16px; }
.card.flat { padding: 0; overflow: hidden; }
h2 { font-family: var(--display); font-weight: 800; font-size: 23px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
h2 span { background: linear-gradient(transparent 58%, var(--mark) 58% 92%, transparent 92%); padding: 0 3px; margin: 0 -3px; }
h3 { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.head.pad { margin-bottom: 6px; }
.hint { color: var(--chalk-2); font-size: 13px; padding: 0 4px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.head small, .muted { color: var(--ink-2); font-size: 13px; }
.hand { font-family: var(--hand); font-weight: 700; font-size: 21px; line-height: 1.1; color: var(--pen-blue); }
.hand.red { color: var(--pen); } .hand.ok { color: var(--ok); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowx { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 11px;
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; text-align: center; line-height: 1.1;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.cta { background: var(--magnet); color: var(--magnet-ink); font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; min-height: 56px; box-shadow: 0 4px 0 #b98f00; width: 100%; }
.btn.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 #b98f00; }
.btn.cta.wait { background: var(--paper-2); color: var(--ink-2); box-shadow: 0 4px 0 var(--wait-sh); font-size: 21px; }
.btn.red { background: var(--pen-fill); color: #fff; }
.btn.yel { background: var(--magnet); color: var(--magnet-ink); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }
.seg { display: flex; background: rgba(0, 0, 0, 0.28); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 38px; border-radius: 9px; color: var(--chalk-2); font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--seg-on); color: var(--ink); }
.seg.inpaper { background: var(--paper-2); }
.seg.inpaper button { color: var(--ink-2); }
.seg.inpaper button.on { background: var(--ink); color: var(--paper); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; min-height: 36px; padding: 0 14px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: 0.03em; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 99px; background: var(--paper-2); font-size: 13px; font-weight: 700; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--paper); }
.chip.warn { background: var(--t-red); color: var(--t-red-ink); } .chip.ok { background: var(--t-ok); color: var(--t-ok-ink); } .chip.info { background: var(--t-blue); color: var(--t-blue-ink); }
.chip.board { background: rgba(255, 255, 255, 0.1); color: var(--chalk); }
.chip.board.on, .chips.scroll .chip.on { background: var(--magnet); color: var(--magnet-ink); }

/* ---------- abas ---------- */
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--board-2); border-top: 2px solid rgba(238, 244, 234, 0.16); padding: 6px 6px calc(6px + var(--sab)); }
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 3px; color: var(--chalk-2); font-size: 11.5px; font-weight: 700; border-radius: 10px; position: relative; }
#tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#tabs button.on { color: var(--magnet); background: rgba(255, 210, 63, 0.12); }
#tabs .badge { position: absolute; top: 0; left: 55%; min-width: 17px; height: 17px; border-radius: 9px; background: var(--pen-fill); color: #fff; font-size: 11px; line-height: 17px; padding: 0 4px; }

/* ---------- ímãs e jogadores ---------- */
.mag {
  --c: var(--r2); display: inline-grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 42%), var(--c);
  color: #101a14; font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 0.01em;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 7px 10px -5px rgba(0, 0, 0, 0.55), inset 0 -3px 0 rgba(0, 0, 0, 0.16), inset 0 1.5px 0 rgba(255, 255, 255, 0.4);
}
.mag.p0 { --c: var(--r0); } .mag.p1 { --c: var(--r1); } .mag.p2 { --c: var(--r2); } .mag.p3 { --c: var(--r3); }
.mag.rg { font-size: 13.5px; letter-spacing: 0; }
.mag.big { width: 62px; height: 62px; font-size: 32px; }
.mag.big.rg { font-size: 20px; }
.mag.rank { --c: var(--paper-2); color: var(--ink); font-size: 17px; }
.prow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 16px; text-align: left; border-top: 1px solid var(--rule); }
.prow:first-child { border-top: 0; }
.prow b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow small { display: block; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow.off { opacity: 0.55; }
.prow .val { font-family: var(--display); font-weight: 800; font-size: 19px; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; background: var(--paper-2); color: var(--ink); vertical-align: 1px; }
.tag.red { background: var(--t-red); color: var(--t-red-ink); } .tag.blue { background: var(--t-blue); color: var(--t-blue-ink); } .tag.yel { background: var(--t-yel); color: var(--t-yel-ink); } .tag.ok { background: var(--t-ok); color: var(--t-ok-ink); }
.bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }
.bar.mid i { background: var(--gold); } .bar.low i { background: var(--pen); }
.mini { width: 46px; flex: none; }
.mini span { display: block; font-size: 10.5px; font-weight: 800; color: var(--ink-2); text-align: right; margin-bottom: 2px; }
.stars { display: inline-block; font-size: 13px; letter-spacing: 1px; background: linear-gradient(90deg, var(--gold) calc(var(--v) * 20%), var(--star-off) 0); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- campo ---------- */
.pitch { position: relative; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 90% at 50% 45%, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.22)), repeating-linear-gradient(180deg, #1f7d4e 0 10%, #1b7247 10% 20%); border: 5px solid var(--frame); box-shadow: var(--card-sh), inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
.pitch.v { aspect-ratio: 10 / 11.8; touch-action: pan-y; }
.zone { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed rgba(255, 255, 255, 0); transition: border-color 0.2s; pointer-events: none; }
.zone em { position: absolute; left: 8px; top: 5px; font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); }
.zone.first { top: 0; border: 0; }
.dragging .zone { border-top-color: rgba(255, 255, 255, 0.55); }
.dragging .zone em { color: rgba(255, 255, 255, 0.85); }
.pitch.h { aspect-ratio: 16 / 9.4; background: repeating-linear-gradient(90deg, #1c7a4c 0 10%, #1a7147 10% 20%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: rgba(255, 255, 255, 0.42); stroke-width: 0.5; }
.slot { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 64px; touch-action: none; cursor: grab; transition: transform 0.12s; }
.slot.drag { z-index: 5; cursor: grabbing; transform: translate(-50%, -58%) scale(1.14); }
.slot.drag .mag { box-shadow: 0 14px 18px -6px rgba(0, 0, 0, 0.65), inset 0 -3px 0 rgba(0, 0, 0, 0.16), inset 0 1.5px 0 rgba(255, 255, 255, 0.4); }
.slot .mag { width: 46px; height: 46px; font-size: 24px; }
.slot.sel .mag { outline: 3px solid var(--magnet); outline-offset: 2px; }
.slot .nm { max-width: 100%; padding: 1px 6px; border-radius: 6px; background: rgba(6, 28, 19, 0.72); color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .en { width: 34px; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.4); overflow: hidden; }
.slot .en i { display: block; height: 100%; background: #7df0a8; }
.slot .en.mid i { background: var(--magnet); } .slot .en.low i { background: #ff7b72; }
.slot .wr { display: none; position: absolute; top: -4px; right: 8px; width: 17px; height: 17px; border-radius: 50%; background: var(--pen-fill); color: #fff; font-size: 12px; font-weight: 800; line-height: 17px; text-align: center; }

/* ---------- duelo de setores ---------- */
.duels { display: flex; flex-direction: column; gap: 7px; }
.duel { display: grid; grid-template-columns: 58px 26px 1fr 26px; align-items: center; gap: 8px; }
.duel span { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.duel b { font-family: var(--display); font-weight: 800; font-size: 19px; text-align: center; }
.duel .track { position: relative; height: 8px; border-radius: 4px; background: var(--pen-fill); overflow: hidden; }
.duel .track i { position: absolute; inset: 0 auto 0 0; background: var(--duel); border-right: 2px solid var(--paper); }
.strip { display: flex; align-items: center; gap: 6px; }
.strip div { flex: 1; text-align: center; background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 7px 2px 6px; color: var(--chalk); }
.strip b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; }
.strip small { font-size: 10.5px; font-weight: 700; color: var(--chalk-2); }
.strip .btn { flex: none; min-height: 48px; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; text-align: center; }
.vs .t { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.vs button.t { color: inherit; }
.vs .t b { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1; text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs .t small { color: var(--ink-2); font-size: 12px; }
.vs .x { font-family: var(--hand); font-weight: 700; font-size: 26px; color: var(--ink-2); padding-top: 14px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: #9aa69c; }
.dots i.V { background: var(--ok); } .dots i.D { background: var(--pen); }

/* ---------- post-it e notas ---------- */
.postit { background: var(--magnet); color: var(--magnet-ink); border-radius: 3px 3px 14px 3px; padding: 12px 14px 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); transform: rotate(-0.6deg); }
.postit:nth-of-type(even) { transform: rotate(0.5deg); }
.postit .hand { color: var(--magnet-ink); font-size: 25px; margin-bottom: 4px; }
.postit p { font-size: 14.5px; margin-bottom: 10px; }
.postit .btn { background: var(--magnet-ink); color: var(--magnet); }
.note { padding: 11px 16px; border-top: 1px solid var(--rule); }
.note b { font-size: 14.5px; } .note p { font-size: 13.5px; color: var(--ink-2); }
.more { display: block; width: 100%; padding: 12px; border-top: 1px solid var(--rule); font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.meter { height: 10px; border-radius: 5px; background: var(--paper-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
.meter.low i { background: var(--pen); } .meter.good i { background: var(--ok); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14.5px; }
.kv:first-child { border-top: 0; }
.kv b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv .pos { color: var(--ok); } .kv .neg { color: var(--pen); }
.opt { display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px var(--rule); }
.opt.on { box-shadow: inset 0 0 0 2.5px var(--ink); background: var(--raise); }
.opt b { display: block; font-size: 15px; } .opt small { display: block; color: var(--ink-2); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fbtn { padding: 9px 4px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px var(--rule); text-align: center; }
.fbtn.on { background: var(--ink); color: var(--paper); box-shadow: none; }
.fbtn b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; }
.fbtn small { font-size: 10.5px; font-weight: 700; opacity: 0.75; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 16px; height: 8px; border-radius: 2px; background: var(--paper-2); }
.pips i.on { background: var(--ink); }
.big { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 0.95; letter-spacing: 0.01em; }
.big.neg { color: var(--pen); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 24px; font-weight: 700; line-height: 1; }
.stepper b { flex: 1; text-align: center; font-family: var(--display); font-weight: 800; font-size: 30px; }
input[type=range] { width: 100%; accent-color: var(--ink); height: 32px; }
input[type=text] { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 11px; border: 1.5px solid var(--ink); background: var(--raise); font: inherit; font-weight: 700; color: var(--ink); }
label { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: block; margin-bottom: 5px; }

/* ---------- tabela ---------- */
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-2); padding: 8px 4px; text-align: center; }
td { padding: 8px 4px; text-align: center; border-top: 1px solid var(--rule); }
td.l, th.l { text-align: left; } td.pts { font-weight: 800; }
tr.me td { background: var(--hl); font-weight: 700; }
td.z { width: 26px; padding-left: 12px; font-weight: 800; position: relative; }
tr.up td.z::before, tr.dn td.z::before, tr.ch td.z::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 5px; border-radius: 0 3px 3px 0; background: var(--ok); }
tr.dn td.z::before { background: var(--pen); } tr.ch td.z::before { background: var(--gold); }
.tclub { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tclub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--rule); font-size: 14px; }
.fx:first-child { border-top: 0; }
.fx span:first-child { text-align: right; } .fx b { font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.fx .w { font-weight: 800; } .fx.me { background: var(--hl); }

/* ---------- folha deslizante ---------- */
#sheet { position: fixed; inset: 0; z-index: 30; display: none; }
#sheet.on { display: block; }
#sheet .bg { position: absolute; inset: 0; background: rgba(4, 16, 11, 0.62); }
#sheetBox { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: inset 0 1px 0 var(--edge); padding: 16px 14px calc(18px + var(--sab)); animation: up 0.2s ease-out; }
#sheetBox::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: -6px auto 10px; }
#sheetBox .x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; color: var(--ink-2); }
@keyframes up { from { transform: translate(-50%, 24px); opacity: 0.6; } }
.attr { display: grid; grid-template-columns: 74px 1fr 28px; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.attr .bar { height: 9px; border-radius: 5px; } .attr .bar i { background: var(--ink); border-radius: 5px; }
.attr b { text-align: right; font-variant-numeric: tabular-nums; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat3 div { background: var(--paper-2); border-radius: 10px; padding: 8px 4px; }
.stat3 b { display: block; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; }
.stat3 small { font-size: 11.5px; color: var(--ink-2); font-weight: 700; }

/* ---------- telas cheias ---------- */
#ov { position: fixed; inset: 0; z-index: 20; display: none; background: var(--board-2); }
#ov.on { display: block; }
.ovin { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: repeating-linear-gradient(180deg, var(--board) 0 64px, var(--board-3) 64px 128px); overflow: hidden; }
.ovscroll { flex: 1; overflow-y: auto; padding: calc(16px + var(--sat)) 14px 24px; display: flex; flex-direction: column; gap: 12px; }
.ovfoot { padding: 10px 14px calc(12px + var(--sab)); background: var(--board-2); border-top: 2px solid rgba(238, 244, 234, 0.16); }
.title { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 24px 22px; color: var(--chalk); }
.clipboard { position: relative; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 46px 20px 22px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 1px var(--edge); transform: rotate(-1.2deg); }
.clipboard::before { content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 120px; height: 40px; border-radius: 9px 9px 5px 5px; background: linear-gradient(#cfd5d0, #8e9892); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.6); }
.clipboard::after { content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 34px; height: 12px; border-radius: 6px; background: var(--board-2); }
.wordmark { font-family: var(--display); font-weight: 900; font-size: clamp(64px, 22vw, 104px); line-height: 0.82; letter-spacing: -0.01em; text-transform: uppercase; }
.wordmark i { font-style: normal; background: linear-gradient(transparent 56%, var(--mark) 56% 90%, transparent 90%); }
.stamp { display: inline-block; padding: 2px 12px; border: 3px solid currentColor; border-radius: 8px; font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; transform: rotate(-4deg); color: var(--ink-2); }
.stamp.V { color: var(--ok); } .stamp.D { color: var(--pen); }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.25); }
.swatches button.on { outline: 3px solid var(--ink); outline-offset: 2px; }

/* ---------- partida ---------- */
.sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 14px 8px; color: var(--chalk); }
.sb .t { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: 0.03em; }
.sb .t:last-child { justify-content: flex-end; }
.sb .sc { text-align: center; }
.sb .sc b { display: block; font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 0.9; letter-spacing: 0.02em; }
.sb .sc small { display: inline-block; margin-top: 3px; padding: 1px 9px; border-radius: 9px; background: var(--magnet); color: var(--magnet-ink); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.mwrap { padding: 0 14px; }
.mdot { position: absolute; width: 15px; height: 15px; margin: -7.5px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9), 0 2px 2px rgba(0, 0, 0, 0.4); transition: left 0.6s, top 0.6s; }
.ball { position: absolute; width: 11px; height: 11px; margin: -5.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #111, 0 3px 4px rgba(0, 0, 0, 0.5); transition: left 0.45s ease-out, top 0.45s ease-out; z-index: 2; }
.goalfx { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 86px; letter-spacing: 0.04em; color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); pointer-events: none; opacity: 0; z-index: 3; }
.goalfx.go { animation: goal 1.3s ease-out; }
.goalfx.them { font-size: 40px; color: #ffd0cc; }
@keyframes goal { 0% { opacity: 0; transform: scale(0.5) rotate(-6deg); } 18% { opacity: 1; transform: scale(1.08) rotate(-3deg); } 75% { opacity: 1; transform: scale(1) rotate(-3deg); } 100% { opacity: 0; transform: scale(1.02) rotate(-3deg); } }
.possbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px 4px; color: var(--chalk-2); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.possbar .track { flex: 1; height: 6px; border-radius: 3px; background: var(--pen); overflow: hidden; }
.possbar .track i { display: block; height: 100%; background: var(--magnet); transition: width 0.5s; }
.feed { flex: 1; overflow-y: auto; margin: 6px 14px 10px; background: var(--paper); border-radius: 14px; list-style: none; scrollbar-width: none; }
.feed li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--rule); font-size: 14px; }
.feed li:first-child { border-top: 0; }
.feed li b { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink-2); }
.feed li.gol { background: var(--hl-strong); font-weight: 700; } .feed li.gol.them { background: var(--t-red); }
.feed li.red span, .feed li.inj span { color: var(--t-red-ink); font-weight: 700; }
.feed li.sys { color: var(--ink-2); font-style: italic; }
.mctl { display: grid; grid-template-columns: 52px 60px 1fr 76px; gap: 8px; }
.mctl .btn { background: rgba(255, 255, 255, 0.1); color: var(--chalk); padding: 0 6px; min-height: 48px; }
.mctl .btn.main { background: var(--magnet); color: var(--magnet-ink); font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }
#toast { position: fixed; left: 50%; bottom: calc(92px + var(--sab)); transform: translate(-50%, 20px); z-index: 40; max-width: min(440px, 92vw); padding: 11px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ---------- partida em 3D (visual do Prancheta original) ---------- */
#stage { position: fixed; inset: 0; z-index: 19; display: none; background: #06140f; color: #f1f5ec; overflow: hidden; }
#stage.on { display: block; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.flt { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 2px rgba(0, 0, 0, 0.9); will-change: transform, opacity; }
.flt.amber { color: #ffd23f; } .flt.cool { color: #9fd1ff; }
#mhud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + var(--sat)) 12px 22px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: linear-gradient(to bottom, rgba(4, 13, 10, 0.82), rgba(4, 13, 10, 0)); pointer-events: none; }
.mscore { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 10px; width: 100%; max-width: 420px; font-family: var(--display); }
.mscore .mt { display: flex; align-items: center; gap: 7px; font-size: 22px; font-weight: 800; letter-spacing: 0.03em; }
.mscore .mt:first-child { justify-content: flex-end; }
.mscore b { font-weight: 900; font-size: 42px; line-height: 1; min-width: 24px; text-align: center; }
.mscore b.pop { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(1.8); color: #ffd23f; } 100% { transform: scale(1); } }
.mscore em { font-style: normal; font-family: var(--body); font-weight: 800; font-size: 13px; color: #2b2100; background: #ffd23f; border-radius: 9px; padding: 2px 8px; min-width: 42px; text-align: center; }
.mcomp { font-size: 12px; font-weight: 700; color: rgba(241, 245, 236, 0.66); }
#ticker { position: absolute; left: 10px; top: calc(92px + var(--sat)); z-index: 5; display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: min(68vw, 330px); }
#ticker div { background: rgba(4, 13, 10, 0.72); border-radius: 9px; padding: 5px 9px; font-size: 13px; font-weight: 600; line-height: 1.25; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: tick 0.35s ease-out; transition: opacity 0.6s; }
#ticker div b { font-family: var(--display); font-weight: 800; font-size: 15px; color: #ffd23f; margin-right: 5px; }
@keyframes tick { from { opacity: 0; transform: translateX(-10px); } }
#mini { position: absolute; right: 10px; top: calc(92px + var(--sat)); z-index: 5; width: 62px; height: 96px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
#gtoast { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; }
#gtoast .t { text-align: center; opacity: 0; padding: 0 12px; }
#gtoast .t.on { animation: gtoast 1.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
#gtoast h2 { font-size: clamp(72px, 26vw, 150px); line-height: 0.85; letter-spacing: -0.01em; color: #fff; -webkit-text-stroke: 2px rgba(0, 0, 0, 0.25); text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); }
#gtoast p { font-family: var(--display); font-weight: 800; font-size: 24px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); margin-top: 6px; }
#gtoast .t.soft h2 { font-size: clamp(44px, 14vw, 76px); }
@keyframes gtoast { 0% { opacity: 0; transform: scale(0.6); } 12% { opacity: 1; transform: scale(1.06); } 22% { transform: scale(1); } 78% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }
#mbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 6px; justify-content: center; padding: 22px 10px calc(12px + var(--sab)); background: linear-gradient(to top, rgba(4, 13, 10, 0.88), rgba(4, 13, 10, 0)); }
.gb { display: grid; place-items: center; height: 46px; min-width: 40px; padding: 0 9px; border-radius: 12px; background: rgba(241, 245, 236, 0.14); color: #f1f5ec; font-weight: 800; font-size: 14px; }
.gb.on { background: #f1f5ec; color: #0f2219; }
.gb.main { flex: 1; max-width: 200px; padding: 0 6px; background: #ffd23f; color: #2b2100; font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 0.02em; text-transform: uppercase; }
.gseg { display: flex; background: rgba(241, 245, 236, 0.14); border-radius: 12px; }
.gseg .gb { background: none; min-width: 36px; padding: 0 4px; }
.gseg .gb.on { background: #f1f5ec; }

/* ---------- elenco agrupado, titulares, posições ---------- */
.grp { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 6px; border-top: 1px solid var(--rule); background: var(--paper-2); }
.grp:first-child { border-top: 0; }
.head.pad + .grp { margin-top: 10px; }
.grp span { font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.grp small { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.grp + .prow { border-top: 0; }
.prow.st { background: linear-gradient(90deg, rgba(255, 210, 63, 0.16), rgba(255, 210, 63, 0) 70%); box-shadow: inset 4px 0 0 var(--magnet); }
.xi { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--magnet); color: var(--magnet-ink); font-family: var(--display); font-weight: 900; font-size: 15px; letter-spacing: 0.04em; vertical-align: middle; }
.prow .right { display: flex; align-items: center; gap: 8px; }
.pc { padding: 0 5px; border-radius: 5px; background: rgba(6, 28, 19, 0.72); color: #dff5e6; font-family: var(--display); font-weight: 800; font-size: 12.5px; letter-spacing: 0.06em; line-height: 16px; }
.pc.bad { background: var(--pen-fill); color: #fff; }
.pc.near { background: var(--magnet); color: var(--magnet-ink); }
.slot.lift { z-index: 6; transform: translate(-50%, -58%) scale(1.14); }
.slot.lift .mag { box-shadow: 0 0 0 3px var(--magnet), 0 14px 18px -6px rgba(0, 0, 0, 0.65), inset 0 -3px 0 rgba(0, 0, 0, 0.16); }
.fitrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.fitrow span { display: flex; flex-direction: column; align-items: center; padding: 5px 0; border-radius: 8px; background: var(--paper-2); font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.05; }
.fitrow b { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); }
.fitrow .same { background: var(--t-ok); color: var(--t-ok-ink); }
.fitrow .near { background: var(--t-yel); color: var(--t-yel-ink); }
.fitrow .other { color: var(--ink-2); }
.ch { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 11px; letter-spacing: 0.04em; vertical-align: 1px; }
.ch.c0 { background: var(--t-red); color: var(--t-red-ink); } .ch.c1 { background: var(--t-yel); color: var(--t-yel-ink); }
.ch.c2 { background: var(--t-blue); color: var(--t-blue-ink); } .ch.c3 { background: var(--t-ok); color: var(--t-ok-ink); }
.txr { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--rule); }
.txr:first-child { border-top: 0; }
.txr b { display: block; font-size: 14.5px; } .txr small { display: block; font-size: 12.5px; color: var(--ink-2); }
.txr > b.num { font-family: var(--display); font-size: 18px; white-space: nowrap; }
.txr .pos { color: var(--ok); } .txr .neg { color: var(--pen); }
.txk { flex: none; width: 66px; text-align: center; padding: 3px 0; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; background: var(--paper-2); }
.txk.in { background: var(--t-ok); color: var(--t-ok-ink); } .txk.out { background: var(--t-blue); color: var(--t-blue-ink); }

/* ---------- celular: sem seleção de texto nem menu de toque longo ---------- */
#app, #stage, #ov, #sheet { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app input, #ov input, #sheet input { -webkit-user-select: text; user-select: text; }
.ovin > .sb { padding-top: calc(10px + var(--sat)); }
.title { padding-top: calc(24px + var(--sat)); padding-bottom: calc(24px + var(--sab)); }
.optrow { display: flex; align-items: center; gap: 12px; }
.optrow > span { flex: 1; font-weight: 700; }
.optrow .seg { width: 170px; flex: none; }
.titlebar { display: flex; justify-content: center; }
.titlebar .chip { gap: 6px; min-height: 36px; padding: 0 14px; }
.titlebar .chip svg { width: 18px; height: 18px; }

</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
  <nav id="tabs" aria-label="Seções do jogo"></nav>
</div>
<div id="stage">
  <canvas id="gl" aria-label="Campo de futebol visto de cima"></canvas>
  <div id="labels"></div>
  <header id="mhud">
    <div class="mscore"><span class="mt" id="hMe"></span><b class="num" id="hSm">0</b><em class="num" id="hClock">0'</em><b class="num" id="hSo">0</b><span class="mt" id="hOp"></span></div>
    <div class="mcomp" id="hComp"></div>
  </header>
  <div id="ticker" aria-live="polite"></div>
  <canvas id="mini" width="124" height="192" aria-hidden="true"></canvas>
  <div id="gtoast"><div class="t" id="gtoastIn"><h2 id="gtoastH"></h2><p id="gtoastP"></p></div></div>
  <footer id="mbar"></footer>
</div>
<div id="ov"></div>
<div id="sheet"><div class="bg" data-a="close"></div><div id="sheetBox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// =====================================================================
// PRANCHETA — motor do jogo (sem DOM): dados, partida, semana, temporada
// =====================================================================
const R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const avg = (a, f, d = 0) => (a.length ? sum(a, f) / a.length : d);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function wpick(arr, w) {
  let s = 0; const ws = arr.map(x => { const v = Math.max(0, w(x)); s += v; return v; });
  let r = R() * s;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
const round5 = v => Math.max(5, Math.round(v / 5) * 5);

// ---------- Tabelas de regras ----------
const POS = ['GOL', 'DEF', 'MEI', 'ATA'];
const POS_N = ['Goleiro', 'Defensor', 'Meia', 'Atacante'];
const KEY = ['g', 'd', 'm', 'a'];

  sell(d) { U.ask = null; sellSheet(pl(+d.id)); },
  listOk(d) { const p = pl(+d.id); listFor(p, U.ask != null ? U.ask : p.list || valueOf(p) * 1.1); U.ask = null; closeSheet(); good(); done(`${p.n} anunciado por ${money(p.list)}.`); },
  unlist(d) { const p = pl(+d.id); listFor(p, 0); U.ask = null; closeSheet(); done(`${p.n} saiu do mercado.`); },
  quick(d) { const p = pl(+d.id); confirmSheet(`Vender ${esc(last(p.n))} agora?`, `Ele sai do clube por ${money(quickPrice(p))} (valor de mercado: ${money(valueOf(p))}).`, 'quickOk', p.id, 'Vender agora', 'red'); },
  quickOk(d) { const r = quickSell(pl(+d.v)); closeSheet(); if (r.ok) { SFX.coin(); HAP.ok(); } else bad(); done(r.msg); },
  watch(d) { const id = +d.id, p = pl(id); G.watch = G.watch.includes(id) ? G.watch.filter(x => x !== id) : [...G.watch, id]; save(); render(); playerSheet(p); },
  sort(d) { U.sort = d.v; render(); },
  release(d) { const p = pl(+d.id); confirmSheet('Dispensar ' + esc(p.n) + '?', `A rescisão custa ${money(p.w * 6)}. Ele fica sem clube.`, 'releaseOk', p.id, 'Dispensar', 'red'); },
  releaseOk(d) { const p = pl(+d.v), e = release(p); closeSheet(); if (e) bad(); else SFX.pay(); done(e || p.n + ' foi dispensado.'); },
  renewSheet(d) { const p = pl(+d.id), w = renewAsk(p); openSheet(`<h2 style="padding-right:36px">Renovar com ${esc(last(p.n))}</h2><div class="stack" style="margin-top:10px"><div>${kv('Salário atual', money(p.w) + ' por semana')}${kv('Ele pede', money(w) + ' por semana')}${kv('Contrato atual', 'até ' + ctrEnd(p))}</div><div class="btns">${[1, 2, 3].map(y => `<button class="btn" data-a="renew" data-id="${p.id}" data-y="${y}">Até ${G.year + y}</button>`).join('')}</div></div>`); },
  renew(d) { const p = pl(+d.id), e = renew(p, +d.y); closeSheet(); if (e) bad(); else good(); done(e || `${p.n} renovou até ${ctrEnd(p)}.`); },
  promote(d) { const p = pl(+d.id), e = promote(p); closeSheet(); if (e) bad(); else good(); done(e || p.n + ' subiu para o elenco.'); },
  dismiss(d) { const p = pl(+d.id); G.youth = G.youth.filter(x => x !== p); closeSheet(); done(p.n + ' deixou a base.'); },
  // clube
  price(d) { G.price = clamp(G.price + +d.v, 10, 200); done(); },
  fac(d) { const f = FAC.find(x => x.id === d.id), l = G.fac[f.id]; if (l >= 4 || G.money < f.cost[l]) return; spend('Obras', f.cost[l]); G.fac[f.id]++; SFX.pay(); setTimeout(good, 170); done(f.n + ' ampliado.'); },
  snd(d) { SFX.init(); SFX.setEnabled(d.v === '1'); if (SFX.enabled) SFX.ok(); render(); },
  vib(d) { HAP.set(d.v === '1'); render(); },
  install() { const e = INSTALL.evt; if (!e) return; INSTALL.evt = null; e.prompt(); e.userChoice.then(() => render(), () => render()); },
  titleSnd() { SFX.init(); SFX.setEnabled(!SFX.enabled); if (SFX.enabled) SFX.ok(); const b = $('#ov [data-a="titleSnd"]'); if (b) b.innerHTML = titleSndHTML(); },
  tema(d) { setTema(d.v); try { if (U.tema) localStorage.setItem(TEMA_KEY, U.tema); else localStorage.removeItem(TEMA_KEY); } catch (e) { /* vale só nesta visita */ } render(); },
  wipe() { confirmSheet('Encerrar esta carreira?', 'O jogo salvo será apagado. Não dá para desfazer.', 'wipeOk', 1, 'Apagar e recomeçar', 'red'); },
  wipeOk() { closeSheet(); store.del(); G = null; ACT.newCareer(); },
  // partida
  mPause() { U.paused = !U.paused; $('#mPauseB').textContent = U.paused ? '▶' : '❚❚'; $('#mPauseB').setAttribute('aria-label', U.paused ? 'Continuar' : 'Pausar'); if (!U.paused) schedule(200); },
  mSpeed() { U.speed = U.speed === 1 ? 2 : U.speed === 2 ? 4 : 1; $('#mSpeedB').textContent = U.speed + '×'; },
  mBoard() { if (U.M && !U.M.done) { clearTimeout(U.timer); if (U.sheet) { U.subOut = null; } boardSheet(); } },
  gSpeed(d) { U.speed = +d.v; GL.setSpeed(U.speed); barHTML(); },
  gCam() { GL.toggleCam(); barHTML(); },
  gSnd() { SFX.init(); SFX.setEnabled(!SFX.enabled); barHTML(); },
  mSkip() { const M = U.M; if (!M || M.done) return; if (U.gl) return GL.skip(); clearTimeout(U.timer); M.auto = true; while (!M.done) stepMinute(M); const news = M.ev.slice(U.seen); U.seen = M.ev.length; paintMatch(news); drawDots(); endMatchUI(); },
  mMent(d) { U.my.ment = d.v; U.M.dirty = true; boardSheet(); },
  mOut(d) { U.subOut = +d.i < 0 ? null : +d.i; boardSheet(); },
  mIn(d) { const S = U.my; doSub(U.M, S, S.on[U.subOut], pl(+d.id)); U.subOut = null; if (U.gl) GL.sync(); else drawDots(); boardSheet(); },
  injIn(d) { const M = U.M, { S, o } = M.pend; doSub(M, S, o, pl(+d.id), ''); M.pend = null; if (!U.gl) drawDots(); closeSheet(); },
  talk(d) { const msg = talk(U.M, U.my, d.v); openSheet(`<h2><span>Intervalo</span></h2><p class="hand" style="margin:12px 0">${msg}</p><div class="btns"><button class="btn ghost" data-a="mBoard">Mexer no time</button><button class="btn" data-a="close">Voltar ao jogo</button></div>`); },
  mEnd() { const M = U.M; if (!M) return; if (U.gl) { GL.stop(); $('#stage').classList.remove('on'); } U.M = null; afterUserMatch(M); G.stage = 'post'; save(); showPost(); },
  week() { endWeek(); G.stage = ''; save(); if (G.over) return showOver(); if (G.review) { const v = G.review; if (v.promoted || v.trophies.length) SFX.fanfare(); else if (v.relegated) SFX.lose(); else SFX.ok(); return showReview(); } hideOv(); U.tab = 'home'; U.view = ''; render(); if (pending().length) setTimeout(() => { SFX.notify(); HAP.tap(); }, 260); else SFX.tap(); },
  rvRenew(d) { const p = pl(+d.id), e = renew(p, 2); save(); if (e) bad(); else good(); if (e) toast(e); else toast(`${p.n} renovou até ${ctrEnd(p)}.`); showReview(); },
  season() { nextSeason(); save(); SFX.whistle(1); hideOv(); U.tab = 'home'; U.view = ''; U.div = me().div; render(); },
  // título e criação
  cont() { const sv = store.get(); if (!sv) return showTitle(); G = sv; reindex(); enter(); },
  newCareer() { const k = pick(SW.slice(0, 11)); U.cr = { name: '', abbr: '', c1: k, c2: pick(['#ffffff', '#111111', '#f2d43a'].filter(x => x !== k)), crest: ri(0, 3), pat: ri(0, 3), auto: true }; showCreate(); },
  crSet(d) { U.cr[d.k] = d.k === 'crest' || d.k === 'pat' ? +d.v : d.v; showCreate(); },
  crRand() { const c = U.cr, n = pick(['Aurora', 'Estrela', 'União', 'Guarani', 'Operário', 'Vila Nova', 'Bandeirante', 'Farol', 'Jangada', 'Trovão', 'Cruzeiro do Sul', 'Laranjal']) + ' ' + pick(['FC', 'EC', 'SC', 'Atlético', 'Esporte']); Object.assign(c, { name: n, abbr: abbrOf(n), c1: pick(SW), crest: ri(0, 3), pat: ri(0, 3), auto: true }); c.c2 = pick(SW.filter(x => colDist(x, c.c1) > 200)); showCreate(); },
  crGo() { SFX.fanfare(); HAP.ok(); const c = U.cr, name = (c.name || '').trim() || 'Prancheta FC'; newGame({ name, abbr: (c.abbr || abbrOf(name)).toUpperCase(), c1: c.c1, c2: c.c2, crest: c.crest, pat: c.pat }); save(); enter(); }
};
function enter() {
  U.tab = 'home'; U.view = ''; U.div = me().div;
  render();
  if (G.over) showOver(); else if (G.review) showReview(); else if (G.stage === 'post' && G.last) showPost(); else hideOv();
}
// som e vibração de cada toque; ações com resultado (compra, venda, gol...) tocam o próprio som
const SND_SEL = new Set(['sub', 'filt', 'sort', 'div', 'form', 'style', 'ment', 'train', 'intens', 'tema', 'negY', 'gSpeed', 'gCam', 'mMent', 'crSet', 'more', 'watch', 'unlist', 'vib']);
const SND_OWN = new Set(['close', 'put', 'auto', 'negSend', 'listOk', 'quickOk', 'releaseOk', 'renew', 'rvRenew', 'promote', 'fac', 'mEnd', 'week', 'season', 'crGo', 'gSnd', 'snd', 'res', 'none']);
function uiSound(a) {
  if (a === 'go') { SFX.tab(); HAP.tap(); } else if (SND_SEL.has(a)) { SFX.select(); HAP.tap(); } else if (!SND_OWN.has(a)) SFX.tap();
  if (a === 'close') SFX.close();
}
const good = () => { SFX.ok(); HAP.ok(); }, bad = () => { SFX.err(); HAP.err(); };
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const fn = ACT[b.dataset.a]; if (fn) { e.preventDefault(); SFX.init(); uiSound(b.dataset.a); fn(b.dataset, b); } });
// ímãs: toque abre o menu; pressionar ~0,25 s "descola" o ímã e aí ele pode ser arrastado
let DR = null;
function armMagnet() { if (!DR) return; DR.armed = true; DR.el.classList.add('lift'); $('#board').classList.add('dragging'); SFX.pick(); HAP.med(); }
document.addEventListener('pointerdown', e => {
  SFX.init();
  const el = e.target.closest('#board .slot'); if (!el || !G) return;
  DR = { el, k: +el.dataset.k, x0: e.clientX, y0: e.clientY, moved: false, armed: false, bd: $('#board').getBoundingClientRect(), id: e.pointerId, t: setTimeout(armMagnet, 240) };
  try { el.setPointerCapture(e.pointerId); } catch (x) { /* sem captura */ }
}, true);
document.addEventListener('pointermove', e => {
  if (!DR || e.pointerId !== DR.id) return;
  if (!DR.armed) { if (Math.hypot(e.clientX - DR.x0, e.clientY - DR.y0) > 9) { clearTimeout(DR.t); DR.cancel = true; } return; }
  DR.moved = true; e.preventDefault();
  const m = me(), p = pl(m.lineup[DR.k]);
  moveSpot(m, DR.k, (e.clientX - DR.bd.left) / DR.bd.width * 100, (e.clientY - DR.bd.top) / DR.bd.height * 100);
  const sp = m.spots[DR.k], code = codesOf(m)[DR.k], g = SP[code].g, mg = DR.el.querySelector('.mag'), pc = DR.el.querySelector('.pc');
  DR.el.style.left = sp.x + '%'; DR.el.style.top = sp.y + '%'; DR.el.classList.add('drag');
  mg.className = 'mag p' + g; mg.textContent = Math.round(ovrAt(p, code));
  pc.textContent = code; pc.className = 'pc ' + pcCls(p, code);
});
function dropMagnet(e) {
  if (!DR || e.pointerId !== DR.id) return;
  const d = DR; DR = null; clearTimeout(d.t);
  if (d.armed || d.cancel) U.dragT = Date.now();
  d.el.classList.remove('lift'); const b = $('#board'); if (b) b.classList.remove('dragging');
  if (d.moved) { SFX.drop(); HAP.tap(); save(); render(); } else if (d.armed) SFX.drop();
}
document.addEventListener('pointerup', dropMagnet);
document.addEventListener('pointercancel', dropMagnet);
document.addEventListener('change', e => { if (e.target.id === 'vol') SFX.select(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'vol') { SFX.setVolume(+t.value / 100); }
  if (t.id === 'negFee') { U.neg.fee = +t.value; $('#negFeeV').textContent = money(U.neg.fee); }
  if (t.id === 'negWage') { U.neg.wage = +t.value; $('#negWageV').textContent = money(U.neg.wage); }
  if (t.id === 'negFee' || t.id === 'negWage') { const p = pl(U.neg.pid), ch = bidChance(p, U.neg.fee, U.neg.wage); if ($('#chFee')) $('#chFee').innerHTML = chTxt(ch.fee); $('#chWage').innerHTML = chTxt(ch.wage); $('#negSum').innerHTML = negSum(clubOf(p.id) ? U.neg.fee : p.ask, U.neg.wage); }
  if (t.id === 'askP') { U.ask = +t.value; const v = valueOf(pl(+$('[data-a="listOk"]').dataset.id)); $('#askV').textContent = money(U.ask); $('#askOdds').innerHTML = oddsTxt(clamp(1.3 - 0.75 * (U.ask / v), 0.04, 0.85), U.ask / v); }
  if (t.id === 'crName') { U.cr.name = t.value; if (U.cr.auto) { U.cr.abbr = abbrOf(t.value); $('#crAbbr').value = U.cr.abbr; } }
  if (t.id === 'crAbbr') { U.cr.abbr = t.value.toUpperCase(); U.cr.auto = false; }
});
function start(d) {
  if (d && d.G && d.G.v === 1) { G = d.G; reindex(); enter(); }
  else showTitle();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (G && !U.M ? { G } : {})); } catch (e) { /* fora do visualizador */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
</body>
